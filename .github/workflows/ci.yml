# Based on https://github.com/actions/starter-workflows/blob/main/ci/django.yml
name: Continuous Integration

on:
  pull_request:
    branches:
      - "*"
  push:
    branches: [dev, master]

env:
  PYTHON_TARGET: 3.11
  DJANGO_SETTINGS_MODULE: tcf_core.settings.ci
  SECRET_KEY: ci-secret-key-not-for-production
  # CI database (GitHub Actions postgres service)
  DB_NAME: tcf_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: localhost
  DB_PORT: 5432

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_TARGET }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci.txt

      - name: Run pylint
        run: |
          export PYTHONPATH="$(pwd)"
          pylint --django-settings-module=${{ env.DJANGO_SETTINGS_MODULE }} --jobs=0 --load-plugins pylint_django tcf_website tcf_core

  django:
    runs-on: ubuntu-latest
    outputs:
      code-coverage: ${{ steps.coverage.outputs.percentage }}
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
          POSTGRES_DB: ${{ env.DB_NAME }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_TARGET }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci.txt

      - name: Migrations & Tests
        run: |
          python manage.py migrate
          coverage run manage.py test

      - name: Get code coverage
        id: coverage
        run: |
          echo "percentage=$(coverage report | grep -o '[0-9]\+%' | tail -1)" >> $GITHUB_OUTPUT

      - name: Enforce coverage threshold
        # Baseline measured at 56.55% on 2026-04-24. Threshold is set 1.5%
        # below baseline so new code can land without manual coverage edits
        # while still failing forward-progress regressions. Raise this number
        # as coverage improves rather than letting it drift.
        run: coverage report --fail-under=55

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm packages
        run: npm ci

      - name: Run ESLint
        run: npx eslint -c .config/.eslintrc.yml tcf_website/static/
