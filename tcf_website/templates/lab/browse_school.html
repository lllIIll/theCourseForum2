<div class="school card mb-3">
    <div class="card-header pt-3" data-toggle="collapse"
        data-target="#school-{{ school.id }}" aria-expanded="true"
        id="header-{{ school.id }}">
        <div class="float-left">
            <h3 class="card-title mb-0 alignleft">{{ school.name }}</h3>
        </div>
        <div class="float-right">
            <i class="fa fa-chevron-down-white" id="chevron-{{ school.id }}"></i>
        </div>
        <div class="clearfix"></div>
    </div>
    <div class="school-body collapse" id="school-{{ school.id }}">
        {% for dept in school.departments_with_labs %}
        <div class="px-3 pt-3">
            <h5 class="mb-2">{{ dept.name }}</h5>
            <ul class="department-list">
                {% for lab in dept.labs %}
                <li>
                    <a href="/lab/{{ lab.slug }}/">{{ lab.pi_name }}</a>
                    {% if lab.is_recruiting %}
                    <span class="badge badge-success ml-1">Recruiting</span>
                    {% endif %}
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</div>
