{% load custom_tags %}
<form method="get" action="{% url 'browse' %}" class="advanced-search">
  <input type="hidden" name="mode" value="labs">

  <div class="advanced-search__grid">
    <div class="advanced-search__field">
      <label for="id_q">Lab name or PI</label>
      <input type="text" name="q" id="id_q" value="{{ lab_form.q.value|default:'' }}" placeholder="Search by name or PI">
    </div>

    <div class="advanced-search__field">
      <label>Department</label>
      {% include "site/common/components/_combo_dropdown.html" with combo_name="department" combo_choices=lab_form.department.field.choices combo_selected=lab_form.department.value combo_aria_label="Department" %}
    </div>

  </div>

  <div class="advanced-search__actions">
    <button type="submit" class="btn btn--primary btn--md">Search labs</button>
    <a href="{% url 'browse' %}?mode=labs" class="btn btn--ghost btn--md">Clear</a>
  </div>
</form>
